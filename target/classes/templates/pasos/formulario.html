<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo != null ? titulo + ' | Recetario' : 'Paso | Recetario'}">Paso | Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/cabecera :: nav}"></div>

  <main class="container py-4 py-lg-5">
    <div class="form-shell">
      <a class="back-link" th:href="@{/pasos}">← Volver a pasos</a>
      <span class="eyebrow d-block mt-4">INSTRUCCIÓN DE PREPARACIÓN</span>
      <h1 class="page-title" th:text="${titulo}">Nuevo paso</h1>

      <form th:action="@{/pasos/guardar}" th:object="${pasoForm}" method="post" novalidate>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{id}">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
          <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="mb-3">
          <label class="form-label" for="recetaId">Receta</label>
          <select
            class="form-select"
            id="recetaId"
            th:field="*{recetaId}"
            th:classappend="${#fields.hasErrors('recetaId')} ? 'is-invalid' : ''">
            <option value="">Selecciona una receta</option>
            <option
              th:each="receta : ${recetas}"
              th:value="${receta.id}"
              th:text="${receta.nombre}">Receta</option>
          </select>
          <div class="invalid-feedback" th:errors="*{recetaId}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="orden">Número de paso</label>
          <input
            class="form-control"
            id="orden"
            type="number"
            min="1"
            step="1"
            th:field="*{orden}"
            th:classappend="${#fields.hasErrors('orden')} ? 'is-invalid' : ''">
          <div class="invalid-feedback" th:errors="*{orden}"></div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="instruccion">Instrucción</label>
          <textarea
            class="form-control"
            id="instruccion"
            rows="5"
            maxlength="1000"
            placeholder="Describe qué hay que hacer"
            th:field="*{instruccion}"
            th:classappend="${#fields.hasErrors('instruccion')} ? 'is-invalid' : ''"></textarea>
          <div class="invalid-feedback" th:errors="*{instruccion}"></div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Guardar paso</button>
          <a class="btn btn-outline-secondary" th:href="@{/pasos}">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments/cabecera :: pie}"></div>
</body>
</html>
