<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
<header th:fragment="nav" class="navbar navbar-expand-lg navbar-dark app-nav">
    <div class="container">
        <a class="navbar-brand fw-semibold" th:href="@{/}">🍲 Recetario</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-label="Abrir menú">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="menu">
            <nav class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/recetas}">Recetas</a>
                <a class="nav-link" th:href="@{/pasos}">Pasos</a>
            </nav>
        </div>
    </div>
</header>
<div th:fragment="avisos" class="container pt-3">
    <div class="alert alert-success alert-dismissible fade show" role="alert" th:if="${mensaje}" th:text="${mensaje}"></div>
    <div class="alert alert-warning alert-dismissible fade show" role="alert" th:if="${error}" th:text="${error}"></div>
</div>
<footer th:fragment="pie" class="container py-4 text-center small text-secondary">
    AD05 · Framework para acceso a datos · Aplicación local de prácticas
</footer>
</body>
</html>
