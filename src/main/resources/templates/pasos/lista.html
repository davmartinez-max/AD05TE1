<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pasos | Recetario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/cabecera :: nav}"></div><div th:replace="~{fragments/cabecera :: avisos}"></div>
<main class="container py-4 py-lg-5"><div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4"><div><span class="eyebrow">INSTRUCCIONES</span><h1 class="page-title">Pasos</h1><p class="text-secondary mb-0">Cada paso está asociado a una receta.</p></div><a class="btn btn-primary" th:href="@{/pasos/nuevo}">＋ Nuevo paso</a></div>
<div th:if="${#lists.isEmpty(pasos)}" class="empty-state"><div class="empty-icon">👩‍🍳</div><h2 class="h4">Todavía no hay pasos</h2><p class="text-secondary">Crea una receta primero y añade sus instrucciones.</p><a class="btn btn-primary" th:href="@{/recetas}">Ir a recetas</a></div>
<div class="table-responsive surface" th:unless="${#lists.isEmpty(pasos)}"><table class="table align-middle mb-0"><thead><tr><th scope="col">Paso</th><th scope="col">Instrucción</th><th scope="col">Receta</th><th scope="col" class="text-end">Acciones</th></tr></thead><tbody><tr th:each="paso : ${pasos}"><td><span class="step-number" th:text="${paso.orden}">1</span></td><td class="instruction-cell" th:text="${paso.instruccion}">Instrucción</td><td><a class="recipe-link" th:href="@{/recetas/{id}(id=${paso.receta.id})}" th:text="${paso.receta.nombre}">Receta</a></td><td class="text-end text-nowrap"><a class="btn btn-sm btn-outline-secondary" th:href="@{/pasos/{id}/editar(id=${paso.id})}">Editar</a> <a class="btn btn-sm btn-outline-danger" th:href="@{/pasos/{id}/eliminar(id=${paso.id})}">Borrar</a></td></tr></tbody></table></div>
</main><div th:replace="~{fragments/cabecera :: pie}"></div></body></html>
