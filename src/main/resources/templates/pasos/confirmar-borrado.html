<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Borrar paso | Recetario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/cabecera :: nav}"></div><main class="container py-5"><section class="confirm-card"><div class="confirm-icon">?</div><h1 class="h3">¿Borrar este paso?</h1><p>Se eliminará el paso <strong th:text="${paso.orden}">1</strong> de la receta <strong th:text="${paso.receta.nombre}">receta</strong>. La receta y el resto de sus pasos seguirán intactos.</p><form th:action="@{/pasos/{id}/eliminar(id=${paso.id})}" method="post" class="d-flex gap-2"><button class="btn btn-danger" type="submit">Sí, borrar paso</button><a class="btn btn-outline-secondary" th:href="@{/pasos}">Cancelar</a></form></section></main><div th:replace="~{fragments/cabecera :: pie}"></div></body></html>
