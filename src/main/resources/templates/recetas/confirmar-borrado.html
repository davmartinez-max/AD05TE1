<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Borrar receta | Recetario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/cabecera :: nav}"></div><main class="container py-5"><section class="confirm-card"><div class="confirm-icon">!</div><h1 class="h3">¿Borrar esta receta?</h1><p>Vas a eliminar <strong th:text="${receta.nombre}">la receta</strong> y todos los pasos que tiene asociados. Esta acción no se puede deshacer.</p><form th:action="@{/recetas/{id}/eliminar(id=${receta.id})}" method="post" class="d-flex gap-2"><button class="btn btn-danger" type="submit">Sí, borrar receta y pasos</button><a class="btn btn-outline-secondary" th:href="@{/recetas/{id}(id=${receta.id})}">Cancelar</a></form></section></main><div th:replace="~{fragments/cabecera :: pie}"></div></body></html>
