<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Recetas | Recetario</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/app.css}"></head>
<body><div th:replace="~{fragments/cabecera :: nav}"></div><div th:replace="~{fragments/cabecera :: avisos}"></div>
<main class="container py-4 py-lg-5">
    <div class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4"><div><span class="eyebrow">TU COLECCIÓN</span><h1 class="page-title">Recetas</h1><p class="text-secondary mb-0">Cada receta puede tener varios pasos de preparación.</p></div><a class="btn btn-primary" th:href="@{/recetas/nueva}">＋ Nueva receta</a></div>
    <div th:if="${#lists.isEmpty(recetas)}" class="empty-state"><div class="empty-icon">🥣</div><h2 class="h4">Aún no hay recetas</h2><p class="text-secondary">Crea la primera y luego añade sus pasos.</p><a class="btn btn-primary" th:href="@{/recetas/nueva}">Crear una receta</a></div>
    <div class="row g-3" th:unless="${#lists.isEmpty(recetas)}"><div class="col-md-6 col-xl-4" th:each="receta : ${recetas}"><article class="recipe-card h-100"><div class="d-flex justify-content-between gap-3"><span class="badge text-bg-light">⏱ <span th:text="${receta.minutosPreparacion}">20</span> min</span><span class="text-secondary small" th:text="|#${receta.id}|">#1</span></div><h2 class="h4 mt-3" th:text="${receta.nombre}">Nombre</h2><p class="text-secondary clamp-3" th:text="${receta.descripcion}">Descripción</p><div class="d-flex flex-wrap gap-2 mt-auto"><a class="btn btn-sm btn-primary" th:href="@{/recetas/{id}(id=${receta.id})}">Ver receta</a><a class="btn btn-sm btn-outline-secondary" th:href="@{/recetas/{id}/editar(id=${receta.id})}">Editar</a><a class="btn btn-sm btn-outline-danger" th:href="@{/recetas/{id}/eliminar(id=${receta.id})}">Borrar</a></div></article></div></div>
</main><div th:replace="~{fragments/cabecera :: pie}"></div></body></html>
