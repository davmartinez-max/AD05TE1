<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${titulo != null ? titulo + ' | Recetario' : 'Receta | Recetario'}">Receta | Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/cabecera :: nav}"></div>

  <main class="container py-4 py-lg-5">
    <div class="form-shell">
      <a class="back-link" th:href="@{/recetas}">← Volver a recetas</a>
      <span class="eyebrow d-block mt-4">FICHA DE RECETA</span>
      <h1 class="page-title" th:text="${titulo}">Nueva receta</h1>
      <p class="text-secondary">Completa los datos principales. Después podrás añadir los pasos.</p>

      <form th:action="@{/recetas/guardar}" th:object="${recetaForm}" method="post" novalidate>
        <input type="hidden" th:if="${_csrf != null}" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{id}">

        <div class="alert alert-danger" th:if="${#fields.hasGlobalErrors()}">
          <p class="mb-0" th:each="err : ${#fields.globalErrors()}" th:text="${err}"></p>
        </div>

        <div class="mb-3">
          <label class="form-label" for="nombre">Nombre</label>
          <input
            class="form-control"
            id="nombre"
            type="text"
            th:field="*{nombre}"
            maxlength="100"
            placeholder="Ej.: Lentejas de la abuela"
            th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid' : ''">
          <div class="invalid-feedback" th:errors="*{nombre}"></div>
        </div>

        <div class="mb-3">
          <label class="form-label" for="descripcion">Descripción</label>
          <textarea
            class="form-control"
            id="descripcion"
            th:field="*{descripcion}"
            rows="4"
            maxlength="500"
            placeholder="Una breve descripción de la receta"
            th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid' : ''"></textarea>
          <div class="invalid-feedback" th:errors="*{descripcion}"></div>
        </div>

        <div class="mb-4">
          <label class="form-label" for="minutosPreparacion">Tiempo de preparación (minutos)</label>
          <input
            class="form-control"
            id="minutosPreparacion"
            type="number"
            min="1"
            step="1"
            th:field="*{minutosPreparacion}"
            th:classappend="${#fields.hasErrors('minutosPreparacion')} ? 'is-invalid' : ''">
          <div class="invalid-feedback" th:errors="*{minutosPreparacion}"></div>
        </div>

        <div class="d-flex gap-2">
          <button class="btn btn-primary" type="submit">Guardar receta</button>
          <a class="btn btn-outline-secondary" th:href="@{/recetas}">Cancelar</a>
        </div>
      </form>
    </div>
  </main>

  <div th:replace="~{fragments/cabecera :: pie}"></div>
</body>
</html>
