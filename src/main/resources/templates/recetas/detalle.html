<!doctype html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="${receta != null and receta.nombre != null ? receta.nombre + ' | Recetario' : 'Receta | Recetario'}">Receta | Recetario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
  <div th:replace="~{fragments/cabecera :: nav}"></div>

  <main class="container py-4 py-lg-5">
    <a class="back-link" th:href="@{/recetas}">← Volver a recetas</a>

    <article class="detail-card mt-4">
      <span class="badge text-bg-light">⏱ <span th:text="${receta.minutosPreparacion}">20</span> min</span>
      <h1 class="page-title mt-3" th:text="${receta.nombre}">Receta</h1>
      <p class="lead text-secondary" th:text="${receta.descripcion}">Descripción</p>
      <hr>

      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <h2 class="h4 mb-0">Preparación</h2>
        <a class="btn btn-sm btn-primary" th:href="@{/pasos/nuevo(recetaId=${receta.id})}">＋ Añadir paso</a>
      </div>

      <div th:if="${#lists.isEmpty(receta.pasos)}" class="text-secondary py-4">
        Todavía no se han añadido pasos.
      </div>

      <ol class="step-list mt-3" th:unless="${#lists.isEmpty(receta.pasos)}">
        <li th:each="paso : ${receta.pasos}">
          <span class="step-number" th:text="${paso.orden}">1</span>
          <span th:text="${paso.instruccion}">Instrucción</span>
        </li>
      </ol>

      <div class="d-flex gap-2 mt-4">
        <a class="btn btn-outline-secondary" th:href="@{/recetas/{id}/editar(id=${receta.id})}">Editar receta</a>
        <a class="btn btn-outline-danger" th:href="@{/recetas/{id}/eliminar(id=${receta.id})}">Borrar receta</a>
      </div>
    </article>
  </main>

  <div th:replace="~{fragments/cabecera :: pie}"></div>
</body>
</html>
